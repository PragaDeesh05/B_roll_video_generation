services:
  redis:
    image: redis:7-alpine
    container_name: incubrix-redis
    restart: unless-stopped

  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: incubrix-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: incubrix-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      USE_MINIO: "true"
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: incubrix-broll
      MINIO_SECURE: "false"
      REDIS_URL: redis://redis:6379/0
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT}
      GOOGLE_CLOUD_LOCATION: ${GOOGLE_CLOUD_LOCATION}
      ENABLE_AI_IMAGE_FALLBACK: "true"
    volumes:
      - ./backend/storage:/app/storage
    depends_on:
      - minio
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: incubrix-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./frontend/certs:/etc/nginx/certs:ro
    depends_on:
      - backend

volumes:
  minio_data:
